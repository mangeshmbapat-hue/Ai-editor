<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- McDonald's story explainer. Hand-built Animation Editor composition (look A "premium dark" in the brand's red,
     cream and yellow, with look C's cartoon face badges and look B's line draw-ons). Every visual is timed to the word
     in the owner's VO (forced alignment, words.json). One paused GSAP timeline on window.__timelines.main. -->
<script src="vendor/gsap.min.js"></script>
<style>
  :root {
    --red: #da291c; --red-deep: #8f160f; --yellow: #ffc72c; --ink: #27251f; --grey: #8a7f72; --cream: #fff6e6; --white: #ffffff;
    --dark-ground: radial-gradient(ellipse 80% 75% at 50% 45%, #a51c12 0%, #6e120c 48%, #3a0806 100%);
    --light-ground: radial-gradient(ellipse 85% 80% at 50% 40%, #fffdf7 0%, #fff6e6 55%, #ffe9c2 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #3a0806; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Inter', 'Inter Display', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  .ground { position: absolute; inset: 0; }
  #gDark { background: var(--dark-ground); }
  #gLight { background: var(--light-ground); }
  .scene { position: absolute; inset: 0; visibility: hidden; transform-origin: 50% 50%; }
  .wipe { position: absolute; border-radius: 50%; width: 4600px; height: 4600px; z-index: 40; visibility: hidden; }
  .hl { font-weight: 800; letter-spacing: -0.025em; line-height: 1.08; white-space: nowrap; }
  .hl span { display: inline-block; white-space: pre; }
  .dark .hl { color: #fff; } .light .hl { color: var(--ink); }
  .y { color: var(--yellow) !important; } .r { color: var(--red) !important; }
  .glow { text-shadow: 0 0 18px rgba(255,199,44,.55), 0 0 50px rgba(255,199,44,.25); }
  .chip { display: inline-flex; align-items: center; gap: 14px; padding: 14px 30px; border-radius: 999px; font-weight: 700; font-size: 32px; white-space: nowrap; box-shadow: 0 14px 36px rgba(0,0,0,.18); }
  .dark .chip { background: var(--yellow); color: var(--ink); }
  .light .chip { background: var(--red); color: #fff; }
  .badge { width: 170px; height: 170px; border-radius: 50%; overflow: hidden; border: 8px solid #fff; box-shadow: 0 18px 40px rgba(0,0,0,.28); }
  .dark .badge { background: #ffd970; } .light .badge { background: #ffe2a0; }
  .badge img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; transform: translateY(6%) scale(1.06); }
  .tag { padding: 10px 26px; border-radius: 16px; background: #fff; color: var(--ink); font-weight: 800; font-size: 30px; box-shadow: 0 12px 30px rgba(0,0,0,.2); white-space: nowrap; text-align: center; }
  .tag small { display: block; font-weight: 600; font-size: 18px; color: var(--grey); letter-spacing: .06em; text-transform: uppercase; }
  .card { background: #fff; border-radius: 40px; box-shadow: 0 30px 70px rgba(143,22,15,.18); display: flex; align-items: center; justify-content: center; }
  .card img { max-width: 82%; max-height: 74%; object-fit: contain; filter: drop-shadow(0 16px 18px rgba(0,0,0,.22)); }
  .prod { filter: drop-shadow(0 30px 40px rgba(0,0,0,.35)); }
  svg.line { overflow: visible; }
  svg.line * { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot { position: absolute; border-radius: 50%; }
  .node { width: 180px; height: 180px; border-radius: 50%; background: #fff; box-shadow: 0 20px 44px rgba(143,22,15,.18); display: flex; align-items: center; justify-content: center; }
  .node svg { width: 92px; height: 92px; }
  .nlabel { font-weight: 800; font-size: 28px; color: var(--ink); text-align: center; white-space: nowrap; }
  .rays { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,199,44,.32) 0deg 5deg, transparent 5deg 18deg); -webkit-mask: radial-gradient(circle, #000 8%, transparent 62%); mask: radial-gradient(circle, #000 8%, transparent 62%); }
  .halo { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,199,44,.55) 0%, rgba(255,199,44,.18) 40%, transparent 70%); }
  .phone { width: 250px; height: 460px; border-radius: 40px; background: #fff; border: 10px solid var(--ink); box-shadow: 0 30px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 30px 18px; }
  .phone .btn { background: var(--red); color: #fff; font-weight: 800; font-size: 24px; padding: 14px 26px; border-radius: 999px; }
  .cursor { width: 70px; height: 70px; z-index: 30; filter: drop-shadow(0 6px 8px rgba(0,0,0,.3)); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="66" data-width="1920" data-height="1080">
  <div id="gDark" class="ground"></div>
  <div id="gLight" class="ground" style="visibility:hidden"></div>
  <div id="particles" class="abs" style="inset:0"></div>
</div>
<script>window.WORDS_NOTE = "times below are the forced-aligned word starts from words.json";</script>
<script src="vendor/gsap.min.js"></script>
<script>
(function () {
  'use strict';
  const root = document.getElementById('root');
  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {}; window.__timelines.main = tl;
  const DUR = 66;

  // ---------- helpers ----------
  function el(tag, cls, parent, css, html) {
    const n = document.createElement(tag); if (cls) n.className = cls; if (css) Object.assign(n.style, css);
    if (html !== undefined) n.innerHTML = html; (parent || root).appendChild(n); return n;
  }
  function at(n, x, y) { n.style.position = 'absolute'; gsap.set(n, { left: x, top: y, xPercent: -50, yPercent: -50 }); return n; }
  function img(src, parent, css, cls) { const i = el('img', cls || 'abs', parent, css); i.src = 'assets/' + src; return i; }
  const lead = 0.12; // visuals arrive just before their word (learned: 0.1-0.4 s)
  const SH = ' drop-shadow(0 30px 40px rgba(0,0,0,.35))';
  const fx = (n, b) => 'blur(' + b + 'px)' + (n.classList && n.classList.contains('prod') ? SH : '');
  function pop(n, t, o) { o = o || {}; tl.fromTo(n, { autoAlpha: 0, scale: o.from || 0.55, filter: fx(n, 14), y: o.dy || 0, rotation: o.rot || 0 },
    { autoAlpha: 1, scale: 1, filter: fx(n, 0), y: 0, rotation: 0, duration: o.dur || 0.5, ease: o.ease || 'back.out(1.7)' }, t - lead); }
  function rise(n, t, o) { o = o || {}; tl.fromTo(n, { autoAlpha: 0, y: o.dy === undefined ? 40 : o.dy, x: o.dx || 0, filter: fx(n, 10) },
    { autoAlpha: 1, y: 0, x: 0, filter: fx(n, 0), duration: o.dur || 0.55, ease: 'power3.out' }, t - lead); }
  function out(n, t, o) { o = o || {}; tl.to(n, { autoAlpha: 0, scale: o.to || 1.08, filter: fx(n, 14), y: o.dy || 0, duration: o.dur || 0.35, ease: 'power2.in' }, t); }
  function words(parent, spec, cls) { // spec: [[text, time, extraClass]]
    return spec.map(([w, t, c]) => { const s = el('span', c || '', parent, null, w + ' '); rise(s, t, { dy: 26, dur: 0.45 }); return s; });
  }
  function svg(parent, vb, inner, css, stroke, width) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', vb); s.setAttribute('class', 'line abs');
    s.innerHTML = inner; Object.assign(s.style, css || {}); parent.appendChild(s);
    s.querySelectorAll('path,circle,ellipse,line,rect,polyline').forEach(p => { p.style.stroke = stroke; p.style.strokeWidth = width || 4; });
    return s;
  }
  function draw(s, t, d) { // stroke draw-on (learned from sample 2)
    const parts = s.querySelectorAll('path,circle,ellipse,line,rect,polyline'); tl.set(s, { autoAlpha: 1 }, t - lead);
    parts.forEach((p, i) => { const L = p.getTotalLength ? p.getTotalLength() : 1000; gsap.set(p, { strokeDasharray: L, strokeDashoffset: L });
      tl.to(p, { strokeDashoffset: 0, duration: (d || 0.8), ease: 'power2.inOut' }, t - lead + i * 0.06); });
  }
  function counter(n, from, to, t, d, fmt) { const o = { v: from }; n.textContent = fmt(from);
    tl.to(o, { v: to, duration: d, ease: 'power2.out', onUpdate: () => { n.textContent = fmt(o.v); } }, t - lead); }
  function badge(parent, who, x, y, size) { const b = at(el('div', 'badge abs', parent, size ? { width: size + 'px', height: size + 'px', borderWidth: Math.max(4, size / 22) + 'px' } : null), x, y);
    const i = el('img', '', b); i.src = 'assets/people/' + who + '.svg'; return b; }
  function scene(cls, t0, t1, drift) { const s = el('div', 'scene ' + cls); tl.set(s, { autoAlpha: 1 }, t0).set(s, { autoAlpha: 0 }, t1);
    tl.fromTo(s, { scale: 1 }, { scale: drift || 1.035, duration: t1 - t0, ease: 'none' }, t0); return s; }
  function ground(dark, t) { tl.set('#gDark', { autoAlpha: dark ? 1 : 0 }, t).set('#gLight', { autoAlpha: dark ? 0 : 1 }, t); }
  function wipe(toDark, t, ox, oy) { // a circle wipe in the theme's own colours (learned from samples 1 and 3)
    const w = el('div', 'wipe', root, { background: toDark ? 'var(--dark-ground)' : 'var(--light-ground)', left: (ox - 2300) + 'px', top: (oy - 2300) + 'px' });
    const ring = el('div', 'wipe', root, { background: 'none', border: '40px solid ' + (toDark ? '#ffc72c' : '#da291c'), left: (ox - 2300) + 'px', top: (oy - 2300) + 'px', zIndex: 41 });
    tl.set([w, ring], { autoAlpha: 1, scale: 0 }, t - 0.55).to(w, { scale: 1, duration: 0.6, ease: 'power3.in' }, t - 0.55)
      .to(ring, { scale: 1.02, duration: 0.6, ease: 'power3.in' }, t - 0.58).set([w, ring], { autoAlpha: 0 }, t + 0.05);
    ground(toDark, t + 0.04);
  }
  function tap(parent, x, y, t, target) {
    const c = el('div', 'cursor abs', parent, null, '<svg viewBox="0 0 24 24"><path d="M9 11V4.5a1.6 1.6 0 013.2 0V10l.4-.1a1.6 1.6 0 013 .6l.3-.1a1.6 1.6 0 013 .9v4.4c0 3.4-2.4 6.3-6 6.3h-.6c-2 0-3.6-1-4.7-2.6L4.4 14a1.6 1.6 0 012.5-2z" fill="#fff" stroke="#27251f" stroke-width="1.3" stroke-linejoin="round"/></svg>');
    gsap.set(c, { left: x + 260, top: y + 260, autoAlpha: 0 });
    tl.to(c, { autoAlpha: 1, left: x, top: y, duration: 0.5, ease: 'power3.out' }, t - 0.6).to(c, { scale: 0.82, duration: 0.08 }, t).to(c, { scale: 1, duration: 0.16 }, t + 0.08);
    tl.to(c, { autoAlpha: 0, duration: 0.3 }, t + 0.7);
    if (target) tl.to(target, { scale: 1.18, duration: 0.22, ease: 'back.out(2.5)' }, t).to(target, { scale: 1, duration: 0.4 }, t + 0.9);
    return c;
  }
  // gentle light particles on the dark ground, warm blobs on the light ground (always some movement, never a shake)
  const P = document.getElementById('particles');
  for (let i = 0; i < 26; i++) { const x = (i * 337) % 1920, y = (i * 571) % 1080, s = 4 + (i % 5) * 3;
    const d = el('div', 'dot', P, { width: s + 'px', height: s + 'px', left: x + 'px', top: y + 'px', background: 'rgba(255,199,44,' + (0.12 + (i % 4) * 0.06) + ')' });
    tl.fromTo(d, { y: 0 }, { y: -120 - (i % 6) * 30, duration: DUR, ease: 'none' }, 0); }
  // grounds follow the scene plan: dark, light, dark, light, dark, light, dark, light
  ground(true, 0);

  // =========== 1. Hook (0 - 6.6 s, dark) ===========
  const s1 = scene('dark', 0, 6.62);
  const globe1 = svg(s1, '-200 -200 400 400', '<circle r="180"/><ellipse rx="70" ry="180"/><ellipse rx="135" ry="180"/><line x1="-180" y1="0" x2="180" y2="0"/><path d="M-160 -80 Q0 -60 160 -80"/><path d="M-160 80 Q0 60 160 80"/>',
    { width: '660px', height: '660px', left: '1200px', top: '200px', opacity: 0.55 }, '#ffc72c', 2.5);
  gsap.set(globe1, { autoAlpha: 0 }); draw(globe1, 3.69, 1.1);
  const h1 = at(el('div', 'halo', s1, { width: '760px', height: '760px' }), 1530, 530);
  tl.fromTo(h1, { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 1.2, ease: 'power2.out' }, 1.9);
  const burger1 = at(img('burger.png', s1, { width: '400px' }, 'abs prod'), 1530, 560);
  pop(burger1, 2.05, { from: 0.3, dur: 0.6 });
  tl.to(burger1, { scale: 1.12, duration: 3.0, ease: 'sine.inOut' }, 2.6);
  const shop1 = svg(s1, '0 0 200 170', '<path d="M20 70 L20 160 L180 160 L180 70"/><path d="M10 70 Q30 40 50 70 Q70 40 90 70 Q110 40 130 70 Q150 40 170 70 Q190 40 195 70"/><rect x="80" y="105" width="40" height="55"/><rect x="35" y="95" width="30" height="28"/><rect x="135" y="95" width="30" height="28"/><path d="M60 10 L140 10 L140 38 L60 38 Z"/>',
    { width: '200px', height: '174px', left: '1640px', top: '840px' }, '#ffc72c', 5);
  gsap.set(shop1, { autoAlpha: 0 }); draw(shop1, 2.51, 0.7);
  const q = el('div', 'abs', s1, { left: '90px', top: '300px' });
  const l1 = el('div', 'hl', q, { fontSize: '62px' }); words(l1, [['Have', 0.11], ['you', 0.27], ['ever', 0.44], ['wondered…', 0.58]]);
  const l2 = el('div', 'hl', q, { fontSize: '62px', marginTop: '12px' }); words(l2, [['how', 1.21], ['a', 1.49], ['small', 1.52], ['burger', 2.05, 'y glow'], ['restaurant', 2.51]]);
  const l3 = el('div', 'hl', q, { fontSize: '62px', marginTop: '12px' }); words(l3, [['became', 3.0], ['one', 3.42], ['of', 3.53], ['the', 3.62], ["world's", 3.69]]);
  const l4 = el('div', 'hl', q, { fontSize: '84px', marginTop: '18px' }); words(l4, [['most', 4.12, 'y glow'], ['recognised', 4.56, 'y glow'], ['brands?', 5.15, 'y glow']]);
  // people who know the brand, in the background around the globe
  ['crowd-ava', 'crowd-leo', 'crowd-mia', 'crowd-raj', 'crowd-kim', 'crowd-omar'].forEach((p, i) => {
    const a = [-2.2, -1.2, -0.3, 0.6, 1.5, 2.4][i]; const b = badge(s1, p, 1530 + Math.cos(a) * 330, 530 + Math.sin(a) * 400, 96);
    gsap.set(b, { opacity: 0.85 }); pop(b, 4.5 + i * 0.09, { from: 0.4, dur: 0.45 }); });

  // =========== 2. Meet McDonald's + the menu (6.6 - 17.0 s, light) ===========
  wipe(false, 6.62, 1360, 560);
  const s2 = scene('light', 6.62, 17.02, 1.02);
  const logoBox = at(el('div', 'abs', s2, { width: '620px', height: '424px' }), 960, 400);
  const arches = img('arches.png', logoBox, { width: '620px', left: 0, top: 0 });
  const wordm = img('wordmark.png', logoBox, { width: '620px', left: 0, top: 0 });
  const orb = at(el('div', 'abs', s2, { width: '120px', height: '120px', borderRadius: '50%', background: 'radial-gradient(circle at 35% 30%, #ffe08a, #ffc72c 55%, #e0a100)', boxShadow: '0 0 60px rgba(255,199,44,.8)' }), 960, 400);
  tl.fromTo(orb, { autoAlpha: 0, scale: 0 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, 6.7).to(orb, { scale: 4, autoAlpha: 0, duration: 0.35, ease: 'power2.in' }, 7.05);
  tl.fromTo(arches, { clipPath: 'inset(100% 0 0 0)', autoAlpha: 1 }, { clipPath: 'inset(0% 0 0 0)', duration: 0.55, ease: 'power3.out' }, 7.1);
  tl.fromTo(wordm, { autoAlpha: 0, x: -60, clipPath: 'inset(0 100% 0 0)' }, { autoAlpha: 1, x: 0, clipPath: 'inset(0 0% 0 0)', duration: 0.6, ease: 'power3.out' }, 7.26 - lead);
  const rays2 = at(el('div', 'rays', s2, { zIndex: -1 }), 960, 400); s2.insertBefore(rays2, s2.firstChild);
  tl.fromTo(rays2, { autoAlpha: 0, scale: 0.5, rotation: 0 }, { autoAlpha: 0.9, scale: 1, rotation: 25, duration: 1.4, ease: 'power2.out' }, 7.2).to(rays2, { rotation: 60, duration: 3, ease: 'none' }, 8.6).to(rays2, { autoAlpha: 0, duration: 0.4 }, 11.0);
  const sub2 = at(el('div', 'hl', s2, { fontSize: '50px' }), 960, 720);
  words(sub2, [['An', 8.27], ['American', 8.39, 'r'], ['multinational', 8.84, 'r'], ['fast-food', 9.65], ['restaurant', 10.24], ['chain', 10.7]]);
  tl.to(logoBox, { scale: 0.42, left: 230, top: 150, duration: 0.45, ease: 'power3.inOut' }, 10.75);
  out(sub2, 11.0, { dy: -20 });
  const known = at(el('div', 'hl', s2, { fontSize: '54px' }), 1110, 150); words(known, [['Known', 11.27], ['for', 11.46], ['its…', 11.62]]);
  const menu = [['burger.png', 'Burgers', 11.77, 290, 300], ['fries.png', 'Fries', 12.43, 630, 230], ['nuggets.png', 'Chicken', 13.11, 960, 300], ['coke.png', 'Beverages', 13.95, 1290, 200], ['brownie.png', 'Desserts', 14.68, 1630, 250]];
  menu.forEach(([src, label, t, x, w], i) => {
    const hal = at(el('div', 'halo', s2, { width: '420px', height: '420px' }), x, 560); tl.fromTo(hal, { autoAlpha: 0, scale: 0.3 }, { autoAlpha: 0.8, scale: 1, duration: 0.6 }, t - 0.1);
    const c = at(img(src, s2, { width: w + 'px', maxHeight: '330px', objectFit: 'contain' }, 'abs prod'), x, 560);
    pop(c, t, { from: 0.5, dy: 120, dur: 0.6, rot: i % 2 ? 6 : -6 });
    tl.to(c, { y: i % 2 ? -14 : 14, duration: 2.2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, t + 0.5);
    const ch = at(el('div', 'chip abs', s2, null, label), x, 775); rise(ch, t + 0.15, { dy: 30, dur: 0.4 });
    if (label === 'Desserts') { const ck = img('cookies.png', s2, { width: '120px' }, 'abs prod'); at(ck, x + 120, 650); pop(ck, t + 0.25, { from: 0.3 }); }
  });
  // quick-service dining: a stopwatch draws, speed streaks pass, and diners appear
  const watch = svg(s2, '-60 -70 120 130', '<circle r="48" cy="5"/><line x1="0" y1="5" x2="0" y2="-25"/><line x1="0" y1="5" x2="22" y2="18"/><line x1="-10" y1="-62" x2="10" y2="-62"/><line x1="0" y1="-62" x2="0" y2="-43"/>',
    { width: '110px', height: '120px', left: '1130px', top: '885px' }, '#da291c', 7);
  gsap.set(watch, { autoAlpha: 0 }); draw(watch, 15.55, 0.6);
  const qs = el('div', 'chip abs', s2, { left: '1260px', top: '905px' }, 'Quick-service dining'); rise(qs, 15.7, { dx: -40, dy: 0 });
  for (let k = 0; k < 4; k++) { const st = el('div', 'abs', s2, { width: '420px', height: '6px', borderRadius: '6px', background: 'linear-gradient(90deg, transparent, #ffc72c)', left: '-450px', top: (430 + k * 70) + 'px' });
    tl.fromTo(st, { x: 0, autoAlpha: 1 }, { x: 2500, duration: 0.55, ease: 'power2.in' }, 15.5 + k * 0.06); }
  ['crowd-sam', 'crowd-nia', 'crowd-arjun'].forEach((p, i) => { const b = badge(s2, p, 260 + i * 150, 940, 120); pop(b, 16.0 + i * 0.1, { from: 0.4 }); });
  const diners = el('div', 'tag abs', s2, { left: '660px', top: '905px' }, 'Diners <small>everywhere</small>'); rise(diners, 16.25, { dx: -30, dy: 0 });

  // =========== 3. 1940: the brothers (17.0 - 25.7 s, dark) ===========
  wipe(true, 17.02, 1700, 900);
  const s3 = scene('dark', 17.02, 25.72);
  const began = at(el('div', 'hl', s3, { fontSize: '46px', opacity: 0.9 }), 960, 170); words(began, [['The', 17.25], ['story', 17.33], ['began', 17.72], ['in', 18.12]]);
  const year = at(el('div', 'hl y glow', s3, { fontSize: '230px' }), 960, 340);
  pop(year, 18.1, { from: 0.6, dur: 0.5 }); counter(year, 1900, 1940, 18.26, 0.7, v => Math.round(v));
  tl.to(year, { scale: 0.55, top: 175, duration: 0.6, ease: 'power3.inOut' }, 19.35); out(began, 19.3);
  const twoB = at(el('div', 'chip abs', s3, null, 'Two brothers'), 960, 330); rise(twoB, 19.75);
  const bR = badge(s3, 'richard', 560, 560, 230), bM = badge(s3, 'maurice', 1360, 560, 230);
  pop(bR, 19.61, { from: 0.3, dur: 0.55 }); pop(bM, 19.88, { from: 0.3, dur: 0.55 });
  const tR = at(el('div', 'tag abs', s3, null, 'Richard McDonald<small>brother</small>'), 560, 745); const tM = at(el('div', 'tag abs', s3, null, 'Maurice McDonald<small>brother</small>'), 1360, 745);
  rise(tR, 20.53, { dy: 30 }); rise(tM, 21.07, { dy: 30 });
  tl.to([bR, tR], { x: -160, duration: 0.6, ease: 'power3.inOut' }, 22.1).to([bM, tM], { x: 160, duration: 0.6, ease: 'power3.inOut' }, 22.1); out(twoB, 22.0);
  const shop3 = svg(s3, '0 0 200 170', '<path d="M20 70 L20 160 L180 160 L180 70"/><path d="M10 70 Q30 40 50 70 Q70 40 90 70 Q110 40 130 70 Q150 40 170 70 Q190 40 195 70"/><rect x="80" y="105" width="40" height="55"/><rect x="35" y="95" width="30" height="28"/><rect x="135" y="95" width="30" height="28"/><path d="M60 10 L140 10 L140 38 L60 38 Z"/><path d="M5 162 L195 162"/>',
    { width: '380px', height: '323px', left: '770px', top: '420px' }, '#ffc72c', 4.5);
