<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <!-- Animation Editor composition (generated by `anim-new`; edit spec.json and re-run, or hand-tune below). -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
__TOKENS__
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __W__px; height: __H__px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      .ground, .layer, .flash { position: absolute; inset: 0; }
      .layer { visibility: hidden; }
      .flash { background: #fafafa; }
      .layer > *, .strip, .cursor, .watermark { position: absolute; }
      .card { background: var(--card); color: var(--ink); border-radius: 22px; box-shadow: 0 10px 40px var(--shadow); }
      .glass { background: var(--glass); color: var(--ink-dark); border: 1px solid var(--glass-line); border-radius: 18px; backdrop-filter: blur(14px); }
      .squircle { border-radius: 24%; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 40px var(--shadow); }
      .logo-word { color: #fff; font-weight: 700; letter-spacing: -0.02em; display: flex; }
      .logo-word span { display: inline-block; }
      .ico { display: inline-flex; flex: none; }
      .ico svg { width: 100%; height: 100%; }
      .pill-bar { display: flex; align-items: center; gap: 2.5%; padding: 0 3.5%; border-radius: 999px; overflow: hidden; white-space: nowrap; }
      .bar-text { position: relative; flex: 1; height: 100%; color: var(--ink); font-weight: 500; }
      .phrase { position: absolute; inset: 0; display: flex; align-items: center; }
      .phrase span, .words span { display: inline-block; white-space: pre; }
      .strip { width: 100%; height: 40%; }
      .product { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 6%; border-radius: 12%; }
      .product img { width: 80%; height: 68%; object-fit: contain; margin-bottom: auto; }
      .product .label { font-weight: 700; text-align: center; line-height: 1.1; }
      .pill { display: flex; align-items: center; color: #fff; font-weight: 600; border-radius: 999px; white-space: nowrap; box-shadow: 0 10px 34px var(--shadow); }
      .dark-pill { background: #0b0b0f; color: #fff; }
      .halo { border-radius: 50%; }
      .ring { border-radius: 50%; border: 10px solid; }
      .status .status-head { display: flex; align-items: center; font-weight: 700; color: var(--ink); }
      .sub { color: var(--muted); font-weight: 500; margin-top: 1%; }
      .track { background: var(--track); border-radius: 99px; overflow: hidden; }
      .fill { height: 100%; border-radius: 99px; }
      .grid { display: grid; }
      .chip, .row { display: flex; align-items: center; font-weight: 600; }
      .chip.card, .row.card { border-radius: 16px; }
      .list { display: flex; flex-direction: column; }
      .avatar { border-radius: 50%; overflow: hidden; margin-right: 4%; flex: none; }
      .avatar img { width: 100%; height: 100%; object-fit: cover; }
      .row .title { font-weight: 700; }
      .orbit, .orbit-item { position: absolute; }
      .orbit-item { display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 8px 14px var(--shadow)); }
      .counter { display: flex; flex-direction: column; align-items: center; gap: 8%; border-radius: 18%; }
      .counter-label { color: var(--ink); font-weight: 600; }
      .counter-pill { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 8%; color: #fff; font-weight: 700; border-radius: 16px; }
      .counter-pill .pm { opacity: 0.85; font-weight: 400; }
      .ends { display: flex; justify-content: space-between; width: 100%; color: var(--muted); }
      .words { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 0.28em; font-weight: 700; letter-spacing: -0.02em; text-align: center; line-height: 1.15; }
      .swap { flex-wrap: nowrap; }
      .slot { position: relative; display: inline-block; min-width: 4.6em; height: 1.2em; }
      .swap-word { position: absolute; left: 0; top: 0; }
      .glow { color: #fff; text-shadow: 0 0 0.12em rgba(255,255,255,.95), 0 0 0.4em rgba(255,255,255,.55), 0 0 0.9em rgba(255,255,255,.3); }
      .glow-accent { text-shadow: 0 0 0.1em var(--glow), 0 0 0.35em var(--glow), 0 0 0.8em color-mix(in srgb, var(--glow) 45%, transparent); }
      .wordmark { font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
      .platform svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .handle { color: #e8e8ee; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
      .prop img { display: block; width: 100%; height: auto; }
      .cursor { z-index: 50; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
      .cursor svg { width: 100%; height: 100%; }
      .watermark { z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; color: var(--mark); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; visibility: hidden; }
      .watermark span { width: 2.2em; height: 2.2em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__"></div>
    <script>window.ANIM_SPEC = __SPEC__;</script>
    <script src="runtime.js"></script>
  </body>
</html>
